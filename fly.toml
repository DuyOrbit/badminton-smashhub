# fly.toml app configuration file generated for badminton-smashhub
# Đặt primary_region = 'sin' để máy chủ đặt tại Singapore (độ trễ thấp nhất cho Việt Nam ~30ms)

app = 'badminton-smashhub'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
