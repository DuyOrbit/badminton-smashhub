# fly.toml app configuration file generated for badminton-smashhub on 2026-11-28T05:25:20Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'badminton-smashhub'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['app']
  size = 'shared-cpu-1x'
