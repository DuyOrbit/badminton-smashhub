version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=badminton_user
      - DB_PASS=badminton_pass
      - DB_NAME=badminton_booking
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "33066:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_pass_123
      - MYSQL_DATABASE=badminton_booking
      - MYSQL_USER=badminton_user
      - MYSQL_PASSWORD=badminton_pass
    volumes:
      - db_data:/var/lib/mysql
      # Auto-import database schema on first run
      - ./badminton_booking.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
